<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Shadow for the outer lens and handle -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(0, -30)">
    <!-- Magnifying Glass Handle -->
    <g filter="url(#dropShadow)">
      <path d="M 590 540 L 890 840 C 910 860 910 890 890 910 C 870 930 840 930 820 910 L 520 610 Z" fill="#1e1e1e" />
    </g>

    <!-- Outer Glass Rim & Shadow -->
    <g filter="url(#dropShadow)">
      <circle cx="500" cy="380" r="230" fill="#1e1e1e" />
    </g>

    <!-- Inner Lens Background (White area inside glass) -->
    <circle cx="500" cy="380" r="185" fill="#ffffff" />

    <!-- Lens Glass Dark Ring -->
    <circle cx="500" cy="380" r="160" fill="#1e1e1e" />

    <!-- Octocat Silhouette inside the lens -->
    <g fill="#ffffff" transform="translate(370, 255) scale(0.55)">
      <!-- Octocat Head & Ears -->
      <path d="M 125 50 
               C 125 50 145 75 160 80 
               C 185 75 215 50 215 50 
               C 215 50 225 85 220 105 
               C 240 120 255 145 255 175 
               C 255 225 210 260 170 265 
               C 170 265 175 285 175 310
               C 175 320 170 330 160 330
               C 140 330 140 310 140 295
               C 140 280 135 270 125 270
               C 115 270 110 280 110 295
               C 110 310 110 330 90 330
               C 80 330 75 320 75 310
               C 75 285 80 265 80 265
               C 40 260 -5 225 -5 175
               C -5 145 10 120 30 105
               C 25 85 35 50 35 50
               C 35 50 65 75 90 80
               C 105 75 125 50 125 50 Z" />
               
      <!-- Tentacle / Tail element pointing left -->
      <path d="M 65 215 Q 40 220 20 200 T 5 190" stroke="#1e1e1e" stroke-width="16" stroke-linecap="round" fill="none" />
      <circle cx="15" cy="195" r="4" fill="#ffffff" />
      <circle cx="30" cy="205" r="3.5" fill="#ffffff" />
      <circle cx="45" cy="212" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- GitHub Text -->
  <text x="500" y="770" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="bold" 
        font-size="130" 
        fill="#1e1e1e" 
        text-anchor="middle" 
        letter-spacing="-1">GitHub</text>
</svg>
